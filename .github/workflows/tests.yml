name: tests

# The badge in the README used to be hand-drawn. This is what makes it true.
#
# Two jobs, because they answer different questions. `build` asks whether the
# code compiles clean and its own tests agree with it. `reference` asks the only
# question that really matters for a tokenizer: does it produce the same tokens
# as OpenAI's implementation? That one needs the real vocabulary and the Python
# package, so it cannot run as part of the unit suite.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.cc }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Clang 18 and earlier cannot build this: C23 `constexpr` for objects
        # landed in Clang 19. Worth keeping the floor visible here rather than
        # only in the README.
        cc: [gcc-13, gcc-14, clang-19]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and PCRE2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ matrix.cc }} libpcre2-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=${{ matrix.cc }}

      # The project already asks for -Wall -Wextra -Wpedantic -Wconversion
      # -Wsign-conversion. A warning that nobody sees is a warning that comes
      # back, so the log is checked and the job fails on any of them.
      - name: Build, and fail on any warning
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" 2>&1 | tee build.log
          if grep -q ': warning:' build.log; then
            echo '::error::build produced warnings'
            grep ': warning:' build.log
            exit 1
          fi

      - name: Unit tests
        working-directory: build
        run: ctest --output-on-failure -j"$(nproc)"

      - name: Examples still run
        working-directory: build
        run: |
          ./count_tokens "Hello, world!" || true
          ./encode_decode || true

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and PCRE2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14 libpcre2-dev

      # AddressSanitizer catches what C lets you do quietly: reading freed memory,
      # writing past a buffer, leaking. It found a heap-use-after-free in this
      # repo's own test suite the first time it ran, in two minutes, on tests that
      # had been passing for months. UBSan covers signed overflow, bad shifts and
      # misaligned access. Neither is optional for a C codebase doing its own
      # arena allocation and pointer arithmetic.
      - name: Build with sanitizers
        run: |
          SAN="-fsanitize=address,undefined"
          cmake -S . -B san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_C_FLAGS="$SAN -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="$SAN"
          cmake --build san -j"$(nproc)"

      # A sanitizer report does not always change the exit code, so the output is
      # searched as well. Leaks are errors here, not warnings.
      - name: Unit tests under sanitizers
        working-directory: san
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          set +e
          fail=0
          for t in base64 bytes hash bpe regex vocab encoding roundtrip; do
            out=$(./test_$t 2>&1); status=$?
            reported=$(echo "$out" | grep -cE 'ERROR: (Address|Leak)Sanitizer|runtime error:')
            if [ "$status" != "0" ] || [ "$reported" != "0" ]; then
              echo "::error::test_$t failed under sanitizers"
              echo "$out" | tail -40
              fail=1
            else
              echo "test_$t clean"
            fi
          done
          exit "$fail"

  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and PCRE2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 libpcre2-dev

      # libFuzzer ships with clang, not gcc. The two targets drive the functions
      # that parse bytes this project did not write: the base64 decoder and the
      # vocabulary parser.
      #
      # A minute each is not a fuzzing campaign, it is a regression gate. It
      # re-runs the committed corpus, which includes every input that has ever
      # crashed these functions, and then explores from there. The first real
      # run found a rank parser that accepted the letter q as zero and an arena
      # that invalidated every pointer it had handed out.
      - name: Build the fuzz targets
        run: |
          cmake -S . -B fz -DCMAKE_C_COMPILER=clang-19 -DTIKTOKEN_FUZZ=ON
          cmake --build fz -j"$(nproc)"

      - name: Fuzz the vocabulary parser
        run: ./fz/fuzz_vocab -max_total_time=60 -print_final_stats=1 fuzz/corpus/vocab

      - name: Fuzz the base64 decoder
        run: ./fz/fuzz_base64 -max_total_time=60 -print_final_stats=1 fuzz/corpus/base64

      # A crash leaves an artifact behind. Keep it, because the input is the bug
      # report and it is the thing that becomes a corpus entry.
      - name: Keep any crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore

  reference:
    name: vs Python tiktoken
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and PCRE2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14 libpcre2-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the reference implementation
        run: pip install -r requirements.txt

      # 1.6 MB from OpenAI on every run is rude, and the file never changes.
      # Six megabytes from OpenAI on every run is rude, and the files never change.
      - name: Cache the vocabularies
        id: vocab
        uses: actions/cache@v4
        with:
          path: data
          key: tiktoken-vocabs-v2

      # All three, because all three patterns are compared now. The o200k pattern
      # in this repo used to be a hand-written approximation, and it disagreed
      # with the reference on 490 of 1000 generated inputs. Nothing caught that,
      # because nothing was comparing it.
      - name: Download the vocabularies
        if: steps.vocab.outputs.cache-hit != 'true'
        run: |
          mkdir -p data
          base=https://openaipublic.blob.core.windows.net/encodings
          for e in cl100k_base o200k_base p50k_base; do
            curl -sSfL -o "data/$e.tiktoken" "$base/$e.tiktoken"
          done
          ls -la data

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc-14
          cmake --build build -j"$(nproc)"

      # test_integration exits 77 when it cannot find the vocabulary or the
      # Python package, and CMake is told to read that as a skip. In this job a
      # skip means the setup above silently failed, so it is treated as failure.
      - name: Compare against the reference, and refuse to skip
        working-directory: build
        run: |
          cp -r ../data .
          cp -r ../tests .
          set +e
          fail=0
          for t in test_integration test_reference_batch; do
            ./$t | tee $t.log
            status=${PIPESTATUS[0]}
            if [ "$status" = "77" ]; then
              echo "::error::$t did not run; the setup above failed silently"
              fail=1
            elif [ "$status" != "0" ]; then
              echo "::error::$t reported a difference from the reference"
              fail=1
            elif grep -q '\[SKIP\]' $t.log; then
              echo "::error::$t skipped a case; this job exists to run all of them"
              fail=1
            fi
          done
          exit "$fail"
